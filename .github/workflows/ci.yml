name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check public inputs, dependency and preserved history
        run: python3 scripts/check_public_surface.py
      - name: Prove regression checks reject hostile changes
        run: python3 scripts/test_public_surface.py
      - name: Build, test and consume the public Apple library
        run: python3 scripts/verify_native.py --work-dir "${{ runner.temp }}/kdna-app-shared-native" --ios
